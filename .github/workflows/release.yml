name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: antigravity-relay
            asset_name: antigravity-relay-linux-x86_64.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: antigravity-relay
            asset_name: antigravity-relay-linux-aarch64.tar.gz
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: antigravity-relay
            asset_name: antigravity-relay-darwin-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: antigravity-relay
            asset_name: antigravity-relay-darwin-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: antigravity-relay.exe
            asset_name: antigravity-relay-windows-x86_64.zip
            is_windows: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross (for cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        shell: bash
        run: |
          cd antigravity-relay
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -j 2
          else
            cargo build --release --target ${{ matrix.target }} -j 2
          fi

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p package
          cp "antigravity-relay/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" package/
          if [ "${{ matrix.is_windows }}" = "true" ]; then
            7z a "${{ matrix.asset_name }}" ./package/${{ matrix.artifact_name }}
          else
            tar -czvf "${{ matrix.asset_name }}" -C package "${{ matrix.artifact_name }}"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
